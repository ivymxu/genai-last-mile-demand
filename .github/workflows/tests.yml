name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[neural]'
      - run: python -m unittest discover -s tests -v
      - run: lastmile --out artifacts
      - run: lastmile --model cvae --hourly --epochs 20 --days 90 --samples 2 --horizon 2 --out neural-artifacts
      - run: lastmile-project --out project-artifacts --replications 2 --horizon 1
      - run: lastmile-submission --results project-artifacts --out technical-submission.zip
      - uses: actions/upload-artifact@v4
        with:
          name: technical-submission
          path: technical-submission.zip
