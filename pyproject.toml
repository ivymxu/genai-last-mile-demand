[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-last-mile-demand"
version = "0.1.0"
description = "Reproducible synthetic demand and scenario generation for ISE450"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "simpy==4.1.1", "streamlit>=1.50,<2", "scipy>=1.14,<2"]

[project.optional-dependencies]
neural = ["torch==2.9.1"]

[project.scripts]
lastmile = "lastmile.cli:main"
lastmile-project = "lastmile.experiments:main"
lastmile-submission = "lastmile.submission:main"

[tool.setuptools.packages.find]
where = ["src"]
